<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>GrowthMetric — Marketing Campaign Analytics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.css" />
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #F5F7FC;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .stlite-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #1E293B;
      gap: 10px;
    }
    .stlite-spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #E2E8F0;
      border-top-color: #EC4899;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div class="stlite-loading">
      <div class="stlite-spinner"></div>
      <div><strong>GrowthMetric — Marketing Analytics</strong></div>
      <div style="font-size:13px;color:#64748B;">Đang khởi động ứng dụng Streamlit (app.py)...</div>
    </div>
  </div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.js";

    async function fetchText(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`Không tải được ${path} (HTTP ${res.status})`);
      return await res.text();
    }

    (async () => {
      try {
        const [appPy, pipelinePy, mapperPy, enginePy] = await Promise.all([
          fetchText("./app.py"),
          fetchText("./data_pipeline.py"),
          fetchText("./schema_mapper.py"),
          fetchText("./analytics_engine.py"),
        ]);

        const entryPy = `
import pyodide_http
pyodide_http.patch_all()
exec(open("app.py", encoding="utf-8").read(), globals())
`;

        mount(
          {
            entrypoint: "vercel_entry.py",
            files: {
              "vercel_entry.py": entryPy,
              "app.py": appPy,
              "data_pipeline.py": pipelinePy,
              "schema_mapper.py": mapperPy,
              "analytics_engine.py": enginePy,
            },
            requirements: [
              "pandas",
              "numpy",
              "plotly",
              "openpyxl",
              "requests",
              "pyodide-http",
            ],
          },
          document.getElementById("root")
        );
      } catch (err) {
        document.getElementById("root").innerHTML =
          `<div style="padding:32px;font-family:sans-serif;color:#B91C1C;">
            <h3>Không thể khởi động ứng dụng Streamlit trên trình duyệt</h3>
            <p>${err.message}</p>
          </div>`;
      }
    })();
  </script>
</body>
</html>
